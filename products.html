<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Product Inventory Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo"><span>📦</span><h2>Inventory</h2></div>
    <nav>
      <a class="nav-btn" href="index.html">🏠 Dashboard</a>
      <a class="nav-btn" href="products.html">📦 Products</a>
      <a class="nav-btn" href="stock.html">🔄 Stock</a>
      <a class="nav-btn" href="suppliers.html">🚚 Suppliers</a>
    </nav>
    <button class="nav-btn logout-btn" id="logoutBtn">🚪 Logout</button>
  </aside>

  <main class="main">

    <header class="header">
      <div>
        <h1>Product Inventory Management</h1>
        <p>Manage your products and stock easily</p>
      </div>
      <div class="date" id="currentDate"></div>
    </header>

    <div class="section-header">
      <div><h2>Products</h2><p>Manage all your products</p></div>
      <button class="primary-btn" id="openModalBtn">+ Add Product</button>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 Search product...">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
        <option value="Stationery">Stationery</option>
        <option value="Furniture">Furniture</option>
      </select>
    </div>

    <div class="panel">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Product</th><th>Category</th><th>Price</th>
              <th>Quantity</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ADD/EDIT PRODUCT MODAL -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Add Product</h2>
      <button id="closeModalBtn">&times;</button>
    </div>

    <form id="productForm">
      <input type="hidden" id="editId">

      <label>Product Name</label>
      <input type="text" id="productName" placeholder="Enter product name" required>

      <label>Category</label>
      <select id="productCategory" required>
        <option value="">Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
        <option value="Stationery">Stationery</option>
        <option value="Furniture">Furniture</option>
      </select>

      <label>Price (₹)</label>
      <input type="number" id="productPrice" placeholder="Enter price" min="0" required>

      <label>Quantity</label>
      <input type="number" id="productQuantity" placeholder="Enter quantity" min="0" required>

      <label>Minimum Stock</label>
      <input type="number" id="minimumStock" placeholder="Enter minimum stock" min="0" required>

      <label>Supplier</label>
      <input type="text" id="productSupplier" placeholder="Enter supplier name" required>

      <button type="submit" class="primary-btn full-btn">Save Product</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
